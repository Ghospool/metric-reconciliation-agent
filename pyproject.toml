[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metric-reconciliation-agent"
version = "0.1.0"
description = "Agent that explains why two reports disagree, with a cent-exact, auditable bridge of causes"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["anthropic>=0.40", "python-dotenv>=1.0"]

[project.scripts]
metric-recon = "metric_recon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metric_recon = ["prompts/*.md"]
